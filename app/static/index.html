<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AIモデリング工房</title>
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-ai-modeling-v3-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-ai-modeling-v3-180.png">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/addons/"
  }
}
</script>
</head>
<body class="home-mode">
<header id="topbar">
  <button id="brand-home" class="brand-home" type="button" aria-label="トップページへ戻る">
    <img class="app-icon" src="/icons/icon-ai-modeling-v3-32.png" alt="">
    <span>T-Lab</span>
  </button>
  <div id="app-version" aria-label="アプリバージョン"></div>
</header>
<div id="layout">
  <aside id="sidebar">
    <div class="sidebar-heading">
      <span>プロジェクト</span>
      <button id="new-project-btn">＋ 新しく作る</button>
    </div>
    <ul id="project-list"></ul>
    <div id="printer-status" class="printer-status" title="プリンタの状態"></div>
  </aside>

  <main id="main">
    <div id="welcome">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <span class="hero-kicker">AI × 3D PRINTING</span>
          <h1 id="hero-title">つくりたい、を<br><em>話す</em>だけ。</h1>
          <p>AIと相談して、形にして、印刷する。</p>
        </div>
      </section>

      <div class="welcome-content">
        <form id="welcome-form" class="idea-card">
          <label for="welcome-input"><span class="sparkle">✦</span>今日は何をつくりますか？</label>
          <textarea id="welcome-input" rows="3" placeholder="作りたいものを自由に入力…"></textarea>
          <div class="prompt-chips" aria-label="入力例">
            <button type="button" data-prompt="玄関に鍵を掛ける壁掛けフック">壁掛けフック</button>
            <button type="button" data-prompt="スマホを立てる卓上スタンド">スマホスタンド</button>
            <button type="button" data-prompt="ケーブルをまとめるクリップ">ケーブルクリップ</button>
          </div>
          <button class="idea-submit" type="submit"><span>✦</span> AIとつくり始める <span>→</span></button>
        </form>

        <section class="recent-section" aria-labelledby="recent-title">
          <div class="section-heading">
            <h2 id="recent-title"><span>◇</span>最近のプロジェクト</h2>
            <button id="all-projects-btn" type="button">すべて見る <span>›</span></button>
          </div>
          <div id="recent-projects" class="recent-projects"></div>
        </section>

        <section class="home-printer-card" aria-label="プリンタの状態">
          <div class="printer-illustration" aria-hidden="true">▣</div>
          <div class="home-printer-copy">
            <strong>Bambu Lab P2S</strong>
            <span id="home-printer-status">状態を確認中…</span>
          </div>
          <button id="printer-settings-btn" type="button"><span>⚙</span> 設定 <span>›</span></button>
        </section>
      </div>
    </div>

    <div id="chat" class="panel hidden">
      <div id="chat-header">
        <span id="chat-title"></span>
        <span id="chat-status" class="status-chip"></span>
        <button id="delete-project-btn" title="このプロジェクトを削除">🗑</button>
      </div>
      <div id="messages"></div>
      <form id="chat-form">
        <textarea id="chat-input" rows="2" placeholder="返答や修正依頼を入力…"></textarea>
        <button type="submit" id="send-btn">送信</button>
      </form>
    </div>
  </main>

  <aside id="preview-panel" class="hidden">
    <h3>モデルプレビュー</h3>
    <div id="version-tabs"></div>
    <div id="viewer"></div>
    <div id="model-summary"></div>
    <div id="model-actions">
      <button id="print-btn" class="btn print hidden">🖨 P2Sで印刷開始</button>
      <a id="download-stl" class="btn" download>⬇ STLダウンロード</a>
      <a id="download-scad" class="btn secondary" download>コード(.scad)</a>
      <button id="mark-printed" class="btn success">✅ 印刷済みにする</button>
    </div>
    <p class="hint" id="print-hint">STLをBambu Studioで開き、スライスしてP2Sに送信してください。</p>
  </aside>
</div>

<div id="loading-overlay" class="hidden">
  <div class="spinner"></div>
  <p id="loading-text">AIが考えています…</p>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
